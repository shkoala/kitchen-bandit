<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7eb">
  <meta name="description" content="Spot what the cat stole in this English speaking game. Play with some, any, a and an or practise food containers.">
  <title>The Fridge Bandit</title>
  <link rel="icon" href="./assets/cat-sit.webp" type="image/webp">
  <link rel="preload" href="./assets/kitchen.webp" as="image">
  <link rel="stylesheet" href="./game.css">
  <script src="./food.js" defer></script>
  <script src="./game.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-paw" viewBox="0 0 28 28">
      <path fill="currentColor" d="M14 11.9c2.6 0 3.9 2.8 5.6 4.1 1.7 1.2 3.5 2.1 3.5 4.5 0 2.5-1.8 4-4 4-2 0-3.1-1.1-5.1-1.1s-3.1 1.1-5.1 1.1c-2.2 0-4-1.5-4-4 0-2.4 1.8-3.3 3.5-4.5 1.7-1.3 3-4.1 5.6-4.1Z"/>
      <ellipse fill="currentColor" cx="4.7" cy="10.9" rx="2.6" ry="3.7" transform="rotate(-28 4.7 10.9)"/>
      <ellipse fill="currentColor" cx="10.5" cy="6.6" rx="2.65" ry="3.8" transform="rotate(-12 10.5 6.6)"/>
      <ellipse fill="currentColor" cx="17.5" cy="6.6" rx="2.65" ry="3.8" transform="rotate(12 17.5 6.6)"/>
      <ellipse fill="currentColor" cx="23.3" cy="10.9" rx="2.6" ry="3.7" transform="rotate(28 23.3 10.9)"/>
    </symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4zM15 9a4.4 4.4 0 0 1 0 6m2.8-9a8.8 8.8 0 0 1 0 12"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4zM16 10l5 5m0-5-5 5"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12M9 9l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2.2"/><ellipse cx="17" cy="16" rx="3" ry="2.2"/></symbol>
    <symbol id="i-music-off" viewBox="0 0 24 24"><path d="m3 3 18 18M9 18v-5M11.6 5.5 20 4v11"/><ellipse cx="6" cy="18" rx="3" ry="2.2"/><path d="M15 15a3.6 3.6 0 0 0-1 1.8c0 1.2 1.3 2.2 3 2.2.7 0 1.3-.2 1.8-.5"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M4 8h4V4m8 0v4h4M4 16h4v4m8 0v-4h4"/></symbol>
    <symbol id="i-refill" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1.4 6.35M20 4v6h-6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.25 12s3.55-6 9.75-6 9.75 6 9.75 6-3.55 6-9.75 6-9.75-6-9.75-6Z"/><circle cx="12" cy="12" r="2.7"/></symbol>
    <symbol id="i-guess" viewBox="0 0 24 24"><path d="M20.5 11a7.8 7.8 0 0 1-8 7.5H6L3.5 21v-6.1A7.2 7.2 0 0 1 4 7.3 8.4 8.4 0 0 1 12.5 4a7.8 7.8 0 0 1 8 7Z"/><path d="M10 8.9a2.4 2.4 0 0 1 4.7.5c0 1.6-2.4 1.7-2.4 3.1"/><path d="M12.3 15.2h.01"/></symbol>
    <symbol id="i-fridge" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="18" rx="2"/><path d="M6.7 9h10.6M9.7 5.4v1M9.7 12v2.5m-1.1 6v1m6.8-1v1"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M4 8.5h16l-1.7 11H5.7L4 8.5Zm4.2.1 2-4.6h3.5l2.1 4.6M9 12l.55 4m5.45-4-.55 4"/></symbol>
  </svg>

  <main class="game">
    <header class="topbar">
      <div class="identity">
        <a class="brand-mark" href="https://vk.ru/abc_shkoala" target="_blank" rel="noopener noreferrer" lang="ru" aria-label="ШКОАЛА · ВКонтакте">
          <img src="./assets/shkoala-logo.png" width="1125" height="383" alt="ШКОАЛА">
        </a>
        <div>
          <h1>The Fridge <span>Bandit</span></h1>
          <p>What’s missing from the fridge?</p>
        </div>
      </div>
      <div class="modes" role="group" aria-label="Game mode">
        <button class="mode" type="button" data-mode="grammar" aria-pressed="true">
          <svg class="icon" aria-hidden="true"><use href="#i-fridge"></use></svg>
          <span>Some, any, a, an</span>
        </button>
        <button class="mode" type="button" data-mode="containers" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#i-box"></use></svg>
          <span>Containers</span>
        </button>
      </div>
      <div class="utilities" role="group" aria-label="Game controls">
        <button class="tool" id="sound" type="button" aria-label="Sound effects" aria-pressed="false" title="Turn sound effects on">
          <svg class="icon" aria-hidden="true"><use href="#i-mute"></use></svg>
        </button>
        <button class="tool" id="music" type="button" aria-label="Background music" aria-pressed="false" title="Turn music on">
          <svg class="icon" aria-hidden="true"><use href="#i-music-off"></use></svg>
        </button>
        <button class="tool" id="reset" type="button" aria-label="Refill the fridge" title="Refill the fridge">
          <svg class="icon" aria-hidden="true"><use href="#i-refill"></use></svg>
        </button>
        <button class="tool" id="fullscreen" type="button" aria-label="Full screen" aria-pressed="false" title="Full screen">
          <svg class="icon" aria-hidden="true"><use href="#i-full"></use></svg>
        </button>
      </div>
    </header>

    <section class="theatre" aria-label="Fridge game">
      <div class="scene" id="scene" data-beat="look">
        <img class="kitchen" src="./assets/kitchen.webp" alt="" fetchpriority="high" draggable="false">
        <div class="scene-shade" aria-hidden="true"></div>

        <div class="progress" id="progress" aria-label="Fridge progress">
          <div class="progress-label">
            <svg class="icon" aria-hidden="true"><use href="#i-paw"></use></svg>
            <span id="progress-text">12 in the fridge</span>
          </div>
          <div class="progress-track" id="progress-track" aria-hidden="true"></div>
        </div>

        <div class="fridge" id="fridge">
          <img class="cabinet" src="./assets/fridge.webp" alt="" draggable="false">
          <div class="fridge-light" aria-hidden="true"></div>
          <div class="shelves" id="shelves" role="group" aria-label="Food in the fridge"></div>
          <div class="door" id="door" data-position="open" aria-hidden="true">
            <img class="door-side door-front" src="./assets/door-front.webp" alt="" draggable="false">
            <img class="door-side door-back" src="./assets/door-back.webp" alt="" draggable="false">
          </div>
        </div>

        <div class="shadow" id="cat-shadow" aria-hidden="true"></div>
        <div class="cat" id="cat" data-pose="sit" aria-hidden="true">
          <img class="cat-pose" data-frame="sit" src="./assets/cat-sit.webp" alt="" draggable="false">
          <img class="cat-pose" data-frame="crouch" src="./assets/cat-crouch.webp" alt="" draggable="false">
          <img class="cat-pose" data-frame="leap" src="./assets/cat-leap.webp" alt="" draggable="false">
          <img class="cat-pose" data-frame="stretch" src="./assets/cat-stretch.webp" alt="" draggable="false">
          <img class="cat-pose" data-frame="tuck" src="./assets/cat-tuck.webp" alt="" draggable="false">
          <img class="cat-pose" data-frame="reach" src="./assets/cat-reach.webp" alt="" draggable="false">
          <img class="carried-food" id="carried-food" alt="" draggable="false" hidden>
        </div>
        <div class="effects" id="effects" aria-hidden="true"></div>
      </div>

      <div class="turn" id="turn" data-phase="look">
        <div class="turn-content" id="status" role="status" aria-live="polite" aria-atomic="true">
          <div class="turn-icon" aria-hidden="true">
            <svg class="icon"><use id="turn-icon" href="#i-eye"></use></svg>
            <img id="answer-image" alt="" hidden>
          </div>
          <div class="turn-text">
            <h2 id="prompt">What’s in the fridge?</h2>
            <p id="hint">Say what you can see. <strong>We’ve got …</strong></p>
          </div>
        </div>
        <button class="action" id="play" type="button" aria-disabled="true">
          <svg class="icon" aria-hidden="true"><use id="action-icon" href="#i-paw"></use></svg>
          <span id="action-text">Let the cat in!</span>
        </button>
      </div>
    </section>
    <footer class="game-footer">
      <a class="more-games" href="https://vk.ru/abc_shkoala?w=donut_payment-190039625&amp;levelId=3559" target="_blank" rel="noopener noreferrer">More games</a>
    </footer>
    <audio id="music-track" src="./assets/fridge-music.mp3" preload="none" loop></audio>
    <noscript>This game needs JavaScript to play.</noscript>
  </main>
</body>
</html>
